<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>企业知识检索 · 离线演示</title>
<style>:root{color-scheme:light}body{margin:0;background:#f4f1ea;color:#22342f;font-family:Georgia,'Songti SC',serif}main{max-width:1050px;margin:55px auto;padding:0 25px}small{letter-spacing:2px;color:#5a7164}h1{font-size:38px;margin:15px 0}p{line-height:1.8}.notice{border-left:4px solid #b58a37;padding:10px 20px;background:#eee5d3}.grid{display:grid;grid-template-columns:300px 1fr;gap:26px;margin-top:28px}section{background:#fffdf8;border:1px solid #d8d9ce;padding:22px;border-radius:8px}h2{font-size:20px}button{border:0;border-radius:5px;padding:12px 18px;background:#235a47;color:white;font:inherit;cursor:pointer;margin:6px 0}button:disabled{opacity:.5;cursor:wait}input[type=file]{max-width:100%}textarea{box-sizing:border-box;width:100%;min-height:110px;padding:14px;border:1px solid #bcc9bd;border-radius:5px;font:inherit}article{border-top:1px solid #d8d9ce;margin-top:18px;padding-top:12px}blockquote{margin:12px 0;background:#f1f5ef;padding:15px;white-space:pre-wrap;line-height:1.8}.muted{font-size:13px;color:#66776f;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#status{line-height:1.7}li{margin:8px 0}@media(max-width:750px){.grid{grid-template-columns:1fr}main{margin-top:25px}h1{font-size:30px}}</style>
<main><small>LOCAL KNOWLEDGE / STATEFLOW</small><h1>把企业文档变成可追溯的证据</h1><p class="notice">完全离线演示 · 未接入大模型<br>当前展示字符特征检索与原文摘录，不提供语义问答、不判断证据充分性。校验通过只表示来源与协议合规。</p><div class="grid"><section><h2>01 / 知识入库</h2><p>支持 PDF、DOCX、MD、TXT，每个文件不超过 10 MB。扫描 PDF 暂不支持。</p><input id="file" type="file" accept=".pdf,.docx,.md,.txt"><button id="upload">导入文件</button><button id="demo">导入示例制度</button><p id="status" role="status"></p><h2>已入库文件</h2><ul id="docs"></ul><p class="muted">同名文件重新导入会替换旧版本。本演示为单用户本地工具，未提供企业登录与权限。</p></section><section><h2>02 / 检索与证据</h2><textarea id="question" placeholder="例如：差旅报销需要什么材料？">差旅报销需要什么材料？</textarea><button id="ask">查找相关原文</button><p id="answer" role="status"></p><div id="results"></div><details><summary>查看证据状态与执行记录</summary><pre id="trace"></pre></details></section></div></main>
<script>const $=id=>document.getElementById(id);async function api(url,options={}){const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}async function refresh(){const docs=await api('/documents');$('docs').replaceChildren();for(const d of docs){const li=document.createElement('li');li.textContent=`${d.name} · ${d.chunk_count} 块`;$('docs').append(li)}}async function busy(button,action){button.disabled=true;try{await action()}catch(e){$('status').textContent=e.message}finally{button.disabled=false}}$('upload').onclick=()=>busy($('upload'),async()=>{const f=$('file').files[0];if(!f)throw Error('请先选择文件');const form=new FormData();form.append('file',f);$('status').textContent='正在解析与建立索引…';const d=await api('/ingest',{method:'POST',body:form});$('status').textContent=d.unchanged?'文件未变化，无需重复入库':`已入库 ${d.name}，共 ${d.chunks} 个片段`;await refresh()});$('demo').onclick=()=>busy($('demo'),async()=>{await api('/demo',{method:'POST'});$('status').textContent='示例制度已入库';await refresh()});$('ask').onclick=()=>busy($('ask'),async()=>{$('answer').textContent='正在检索…';$('results').replaceChildren();const d=await api('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('question').value})});$('answer').textContent=d.answer;for(const [i,c]of d.citations.entries()){const a=document.createElement('article'),h=document.createElement('strong'),b=document.createElement('blockquote'),m=document.createElement('p');h.textContent=`[${i+1}] ${c.file} · ${c.location}`;b.textContent=c.text;m.className='muted';m.textContent=`证据 ${c.span_id} · 版本 ${c.version}`;a.append(h,b,m);$('results').append(a)}$('trace').textContent=JSON.stringify({gate:d.gate,evidence_state:d.evidence_state,trace:d.trace},null,2)});refresh().catch(e=>$('status').textContent=e.message)</script></html>
